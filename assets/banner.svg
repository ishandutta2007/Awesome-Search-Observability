<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d11" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 52px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 22px;
        fill: #94a3b8;
      }
      .wave {
        animation: pulseWave 4s ease-in-out infinite alternate;
      }
      .signal {
        animation: signalPulse 2s ease-in-out infinite;
      }
      @keyframes pulseWave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes signalPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Decorative Glowing Orb -->
  <circle cx="1000" cy="150" r="180" fill="url(#glow)" opacity="0.15" filter="url(#blur-glow)" />
  <circle cx="150" cy="80" r="120" fill="#3b82f6" opacity="0.1" filter="url(#blur-glow)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Dynamic Animated Chart Wave -->
  <path d="M 50,220 Q 180,260 300,180 T 600,160 T 900,100 T 1150,70" 
        fill="none" stroke="url(#pulse)" stroke-width="6" stroke-linecap="round" filter="url(#blur-glow)">
    <animate attributeName="d" 
             values="M 50,220 Q 180,260 300,180 T 600,160 T 900,100 T 1150,70;
                     M 50,210 Q 180,180 300,220 T 600,120 T 900,150 T 1150,60;
                     M 50,220 Q 180,260 300,180 T 600,160 T 900,100 T 1150,70" 
             dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Node points with dynamic pulse -->
  <circle cx="300" cy="180" r="7" fill="#00DFD8">
    <animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="160" r="7" fill="#FF0080">
    <animate attributeName="r" values="7;11;7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="100" r="7" fill="#7928CA">
    <animate attributeName="r" values="6;10;6" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Search Icon Graphic -->
  <g transform="translate(80, 85)">
    <circle cx="35" cy="35" r="28" fill="none" stroke="url(#glow)" stroke-width="7"/>
    <line x1="56" y1="56" x2="80" y2="80" stroke="url(#glow)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 22 35 A 13 13 0 0 1 35 22" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Main Title & Text -->
  <text x="195" y="125" class="title">Awesome Search Observability</text>
  <text x="195" y="165" class="subtitle">🔍 Query Analytics • 📊 Latency Metrics • 🎯 Relevance Monitoring • 📈 Conversions</text>

  <!-- Dynamic Pulsing Tag Badges -->
  <g transform="translate(195, 195)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚡ Real-Time</text>
    
    <rect x="155" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="230" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="middle">🎯 nDCG &amp; Relevance</text>

    <rect x="320" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="400" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="middle">🚀 Open &amp; Commercial</text>
  </g>
</svg>
